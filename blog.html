<style>
.main-content { padding: 0px 0; }
h1 { text-align: center; margin-bottom: 32px; }

.blog-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
  max-width: 1100px;
  margin: 0 auto;
  margin-bottom: 40px;
  padding: 0 12px;
}

.blog-card {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.18s;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 100px;
}

.blog-card:hover {
  box-shadow: 0 6px 24px rgba(0,0,0,0.13);
  transform: translateY(-2px) scale(1.02);
}

.blog-thumb {
  width: 100%;
  height: 170px;
  object-fit: cover;
  display: block;
}

.blog-card-body {
  padding: 16px 18px 18px 18px;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.blog-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 12px;
}

.blog-card-body h3 {
  margin: 0 0 10px 0;
  font-size: 1.18rem;
  color: #1976d2;
  font-weight: 700;
}

.blog-short {
  color: #444;
  font-size: 1rem;
  margin: 0;
}

.modal {
  display: none; 
  position: fixed; 
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center; 
  align-items: center;
  z-index: 9999;
}

.modal-content {
  background: #fff;
  padding: 20px;
  max-width: 96vw;
  width: 100%;
  border-radius: 12px;
  position: relative;
  box-sizing: border-box;
  max-height: 90vh;
  overflow-y: auto;
  margin: 20% 20%;
}

.close {
  position: absolute;
  top: 10px; right: 15px;
  font-size: 60px;      /* Make X bigger */
  font-weight: bold;    /* Make X bolder */
  cursor: pointer;
  color: #1976d2;
  z-index: 2;
}

.video-wrapper {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* 16:9 aspect ratio */
  height: 0;
  overflow: hidden;
  margin: 18px 0;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  background: #000;
}
.video-wrapper iframe,
.video-wrapper video {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 14px;
  background: #000;
}
.fb-post {

}

color: rgb(255, 205, 9)

  // Render blog cards dynamically
const blogContainer = document.getElementById("blogContainer");
blogContainer.innerHTML = Object.entries(blogs).map(([id, blog]) => `
  <div class="blog-card" onclick="openModal('${id}')">
    <img class="blog-thumb" src="${blog.thumbnail}" alt="Thumbnail ${blog.title}">

function openModal(id) {
  const blog = blogs[id];
  document.getElementById("modalBody").innerHTML = `
    <h2>${blog.title}</h2>
    <div id="blogPreview">${blog.preview}</div>
    <div id="blogFull" style="display:none">${blog.full}</div>
    <button id="toggleMoreBtn" class="add-to-cart-btn" style="margin:18px auto 0 auto;display:block;">Xem thêm</button>
  `;
  document.getElementById("blogModal").style.display = "flex";

  // Toggle show more/less
  const btn = document.getElementById("toggleMoreBtn");
  const full = document.getElementById("blogFull");
  btn.onclick = function() {
    if (full.style.display === "none") {
      full.style.display = "block";
      btn.textContent = "Thu gọn";
    } else {
      full.style.display = "none";
      btn.textContent = "Xem thêm";
    }
    // Re-parse Facebook plugins if FB SDK is loaded
    if (window.FB && typeof FB.XFBML.parse === "function") {
      FB.XFBML.parse(full);
    }
  };

  // Re-parse Facebook plugins if FB SDK is loaded (for preview)
  if (window.FB && typeof FB.XFBML.parse === "function") {
    FB.XFBML.parse(document.getElementById("modalBody"));
  }
}

function closeModal() {
  document.getElementById("blogModal").style.display = "none";
}

// Close modal when clicking outside modal-content
document.getElementById("blogModal").addEventListener("click", function(e) {
  if (e.target === this) {
    closeModal();
  }
});
