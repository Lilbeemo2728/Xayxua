  document.getElementById("blogModal").style.display = "flex";

  const btn = document.getElementById("toggleMoreBtn");
  const full = document.getElementById("blogFull");
  btn.onclick = function() {
    if (full.style.display === "none") {
      full.style.display = "block";
      btn.textContent = window.xayxuaI18n ? window.xayxuaI18n.t('blog.collapse') : "Thu gọn";

      full.style.display = "none";
      btn.textContent = window.xayxuaI18n ? window.xayxuaI18n.t('blog.readmore') : "Xem thêm";
